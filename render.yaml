# Blueprint do Render para o backend do Qolop
#
# Para usar via dashboard:
#   Render > New > Blueprint > selecionar este repositório
# O Render detecta este arquivo e cria o serviço com a configuração abaixo.
#
# Depois de criar o serviço, configure as variáveis marcadas com "sync: false"
# (DATABASE_URL, JWT_SECRET, ALLOWED_ORIGINS, SMTP...) no painel do Render.

services:
  - type: web
    name: qolop-backend
    runtime: node
    rootDir: backend
    # NODE_ENV=production faz o npm pular devDependencies no install.
    # O build precisa delas (@types, prisma CLI), então forçamos --include=dev.
    # Também usamos --workspaces=false: sem isso o npm detecta o package.json
    # da raiz (monorepo), hoista os @types do frontend para a raiz e o tsc
    # falha com conflito entre @types/express v4 (backend) e v5 (raiz via
    # @types/multer).
    buildCommand: npm install --workspaces=false --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ALLOWED_UPLOAD_MIME_TYPES
        sync: false
      - key: MAX_UPLOAD_FILE_SIZE
        sync: false
